<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css" integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <h2>Завдання A: Візитка</h2>
  <div class="card">
    <h3>Ім'я Прізвище</h3>
    <p>Frontend Developer</p>
  </div>

  <h2>Завдання B: Галерея</h2>
  <div class="gallery">
    <img class="gallery-item" src="https://picsum.photos/200/140?1" alt="">
    <img class="gallery-item" src="https://picsum.photos/200/140?2" alt="">
    <img class="gallery-item" src="https://picsum.photos/200/140?3" alt="">
  </div>

  <h2>Завдання C: Портфоліо</h2>
  <div class="portfolio">
    <div class="overlay">
      <h3>Проєкт сайту</h3>
      <p>Короткий опис проєкту</p>
    </div>
  </div>

  <h2>Завдання D: Модалка</h2>

  <!-- checkbox hack -->
  <input type="checkbox" id="modal-toggle">

  <label for="modal-toggle" class="open-btn">
    Переглянути товар
  </label>

  <div class="modal-backdrop">
    <div class="modal">
      <label for="modal-toggle" class="close">✖</label>

      <img src="https://picsum.photos/400/200" alt="">

      <div class="modal-content">
        <h3>Товар</h3>
        <p>Ціна: 999 грн</p>
        <p>Опис товару з характеристиками</p>

        <div class="buy-btn">Додати в кошик</div>
      </div>
    </div>
  </div>

</body>
</html>
