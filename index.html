<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./sass/main.css">
  </head>
  <body>
    <div class="alert alert--info">
  <h2 class="alert__title">Інформація</h2>
  <p class="alert__text">Доступне нове завдання.</p>
  <button class="alert__close" type="button">&times;</button>
</div>

<div class="alert alert--success">
  <h2 class="alert__title">Місію виконано</h2>
  <p class="alert__text">Ти отримав 250 XP.</p>
  <button class="alert__close" type="button">&times;</button>
</div>

<div class="alert alert--warning">
  <h2 class="alert__title">Попередження</h2>
  <p class="alert__text">У тебе залишилося мало енергії.</p>
  <button class="alert__close" type="button">&times;</button>
</div>

<div class="alert alert--error">
  <h2 class="alert__title">Помилка</h2>
  <p class="alert__text">Не вдалося виконати завдання.</p>
  <button class="alert__close" type="button">&times;</button>
</div>
  </body>
</html>
